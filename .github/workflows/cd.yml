name: CD

# After CI succeeds on master: push images to GHCR, then deploy to the server.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

jobs:
  push-images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - HappyHeadlines.ArticleService.WebAPI
          - HappyHeadlines.ArticleCacheWorker
          - HappyHeadlines.CommentService.WebAPI
          - HappyHeadlines.ProfanityService.WebAPI
          - HappyHeadlines.DraftService.WebAPI
          - HappyHeadlines.PublisherService.WebAPI
          - HappyHeadlines.NewsletterService.WebAPI
          - HappyHeadlines.SubscriberService.WebAPI
          - HappyHeadlines.Gateway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR needs lowercase names.
      - name: Image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          service="${MATRIX_SERVICE,,}"
          echo "name=ghcr.io/${owner}/${service}" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_SERVICE: ${{ matrix.service }}

      - name: Build and push (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: push-images
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Deploy is optional: without DEPLOY_HOST the remaining steps are skipped.
      - name: Check deploy secrets
        id: deploy
        run: |
          if [ -n "$DEPLOY_HOST" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "No DEPLOY_HOST secret, skipping deploy"; fi
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - uses: actions/checkout@v4
        if: steps.deploy.outputs.enabled == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up SSH
        if: steps.deploy.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      # The compose file mounts these two folders.
      - name: Copy compose files
        if: steps.deploy.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/happyheadlines"
          scp -i ~/.ssh/id_deploy -r docker-compose.yml featureflags monitoring "$DEPLOY_USER@$DEPLOY_HOST:happyheadlines/"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Pull and start
        if: steps.deploy.outputs.enabled == 'true'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ssh -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<EOF
          set -e
          cd ~/happyheadlines
          echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin
          export IMAGE_REGISTRY=ghcr.io/${owner}
          export IMAGE_TAG=${IMAGE_TAG}
          docker compose pull
          docker compose up -d
          EOF
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
