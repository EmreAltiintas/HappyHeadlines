# Prometheus scrapes the /metrics endpoint (OpenTelemetry Prometheus exporter, see
# HappyHeadlines.Observability) of every service that owns a cache.
# The cache counters are cache_hits_total / cache_misses_total / cache_evictions_total,
# labelled cache="ArticleCache" | "CommentCache".
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: articleservice
    metrics_path: /metrics
    static_configs:
      - targets:
          - articleservice1:8080
          - articleservice2:8080
          - articleservice3:8080

  - job_name: commentservice
    metrics_path: /metrics
    static_configs:
      - targets:
          - commentservice:8080
